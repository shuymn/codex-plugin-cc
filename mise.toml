# Each tool tracks its major version; mise.lock pins the exact versions and
# checksums, and .github/workflows/mise-update.yml advances it.
[tools]
node = "24"
pnpm = "12"
# Linters the shared security and gha workflows also run; the git hooks use
# these so local checks match CI.
actionlint = "1"
betterleaks = "1"
ghalint = "1"
# The Codex CLI that `pnpm run build` uses to generate the app-server types.
"npm:@openai/codex" = "0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
locked = true
# Install npm-backed tools such as the Codex CLI with npm everywhere, whatever
# installer the local mise defaults to.
npm.package_manager = "npm"
# Matches the minimumReleaseAge of the shared Renovate preset.
minimum_release_age = "3d"
